<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Previz Player</title>
<style>
  body{margin:0; background:#0f1115; color:#e8eaf0; font:16px/1.6 system-ui,sans-serif;
       display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:16px; padding:24px; box-sizing:border-box}
  video{max-width:min(1280px,100%); width:100%; border-radius:10px; border:1px solid #2a2f3a}
  h1{font-size:1.1rem; font-weight:600}
  a{color:#c8f04a}
</style>
</head>
<body>
<h1 id="title">Previz</h1>
<video id="vid" controls autoplay playsinline></video>
<p><a href="index.html">← Back to the development journey</a></p>
<script>
  var q = new URLSearchParams(location.search).get("v");
  var v = (q === "2" || q === "3" || q === "4") ? q : "1";
  var vid = document.getElementById("vid");
  if (v === "3") {
    vid.src = "videos/ninja_final.mp4";
    vid.poster = "img/poster_ninja.jpg";
    document.getElementById("title").textContent =
      "Part 2 — Ninja on the torii lane (depth-guided AI video from the v2 previz)";
  } else if (v === "4") {
    vid.src = "videos/ninja_guide.mp4";
    vid.poster = "img/poster_guide.jpg";
    document.getElementById("title").textContent =
      "The Blender blocking guide — humanoid + katana proxy that steered the ninja video's motion and camera";
  } else {
    vid.src = "videos/blocking_" + v + ".mp4";
    vid.poster = "img/poster_" + v + ".jpg";
    document.getElementById("title").textContent = v === "2"
      ? "v2 — Textured walls + living five-beat camera (one continuous shot)"
      : "v1 — Corridor, box person, simple follow camera";
  }
</script>
</body>
</html>
